name: One-shot ratings repair

on:
  push:
    branches:
      - fix/ratings-row-width

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ratings-row-width
      - name: Restore verified ratings CSV
        env:
          DATA_B64: 
        run: |
          python - <<'PY'
          import os, base64, gzip
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(os.environ['DATA_B64']))
          Path('data/ratings.csv').write_bytes(raw)
          lines = raw.decode('utf-8-sig').splitlines()
          expected = len(lines[0].split(','))
          bad = [(i + 1, len(line.split(','))) for i, line in enumerate(lines) if len(line.split(',')) != expected]
          assert len(lines) == 77, len(lines)
          assert expected == 38, expected
          assert not bad, bad
          print('validated:', len(lines), 'rows x', expected, 'columns')
          PY
      - name: Commit repaired data and remove one-shot workflow
        run: |
          rm .github/workflows/fix-ratings.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix ratings CSV row widths"
          git push origin HEAD:fix/ratings-row-width

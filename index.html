<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞赛 Rating 管理系统</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
<div class="container">
    <div class="top-nav">
        <button id="nav-rating" class="nav-btn" onclick="app.showPage('rating')">Rating 榜</button>
        <button id="nav-medals" class="nav-btn" onclick="app.showPage('medals')">奖牌榜</button>
    </div>

    <section id="page-rating" class="page-section">
        <div class="card">
            <div class="header-row">
                <h1>Rating 统计看板</h1>
                <div class="toolbar">
                    <label class="toggle-label">
                        <input type="checkbox" id="toggleInactive" onchange="app.renderTable(); app.renderChart();">
                        显示休眠选手
                    </label>
                    <button class="btn btn-export" onclick="exportToExcel()">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                        导出 Excel
                    </button>
                </div>
            </div>
            <div id="load-error" class="load-error" hidden></div>
            <div class="chart-container"><canvas id="ratingChart"></canvas></div>
        </div>
        <div class="card table-card">
            <div class="table-wrapper" id="table-container"><p class="loading">正在加载数据...</p></div>
        </div>
    </section>

    <section id="page-medals" class="page-section">
        <div class="card">
            <div class="header-row compact"><h1>奖牌榜</h1></div>
            <div class="medal-rules">
                单场奖励互斥，按最高档记录：参赛人数 ≥ 20 的冠军记金冠，否则冠军记银冠；非冠军前 10% 记金牌、前 30% 记银牌、前 60% 记铜牌（均向上取整）。<br>
                排序关键字依次为：金冠、银冠、金牌、银牌、铜牌，均按数量降序；完全相同再按当前 Rating、ID 排序。
            </div>
        </div>
        <div class="card table-card">
            <div class="table-wrapper" id="medal-table-container"><p class="loading">正在加载数据...</p></div>
        </div>
    </section>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞赛 Rating 管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color:#f4f6f9; --card-bg:#fff; --border-color:#e1e4e8; --text-primary:#2c3e50; --header-bg:#f8f9fa; }
        * { box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg-color); color:var(--text-primary); padding:20px; margin:0; }
        .container { max-width:1280px; margin:0 auto; }
        .top-nav { display:flex; gap:8px; margin-bottom:16px; }
        .nav-btn { border:1px solid #d0d7de; background:#fff; color:#34495e; padding:9px 16px; border-radius:7px; cursor:pointer; font-weight:600; }
        .nav-btn.active { background:#2f6feb; color:#fff; border-color:#2f6feb; }
        .page-section { display:none; }
        .page-section.active { display:block; }
        .card { background:var(--card-bg); padding:20px; border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.05); margin-bottom:20px; }
        .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:10px; flex-wrap:wrap; }
        h1 { margin:0; font-size:1.5rem; color:#333; flex-grow:1; }
        h2 { margin:0; font-size:1.2rem; }
        .btn { border:none; padding:10px 15px; border-radius:5px; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:5px; color:white; transition:opacity .2s; }
        .btn:hover { opacity:.9; }
        .btn-export { background:#28a745; }
        .btn svg { width:16px; height:16px; fill:white; }
        .chart-container { position:relative; height:350px; width:100%; }
        .table-wrapper { overflow:auto; max-height:75vh; border:1px solid var(--border-color); border-radius:4px; }
        table { width:100%; border-collapse:separate; border-spacing:0; font-size:14px; }
        th,td { padding:10px; border-bottom:1px solid var(--border-color); border-right:1px solid var(--border-color); text-align:center; white-space:nowrap; background:#fff; }
        th { background:var(--header-bg); font-weight:600; position:sticky; top:0; z-index:10; }
        #rating-table-data th:nth-child(1), #rating-table-data td:nth-child(1) { position:sticky; left:0; z-index:11; border-right:2px solid #ddd; }
        #rating-table-data th:nth-child(2), #rating-table-data td:nth-child(2) { position:sticky; left:50px; z-index:11; border-right:2px solid #ddd; }
        #rating-table-data th:nth-child(1), #rating-table-data th:nth-child(2) { z-index:20; }
        .user-newbie { color:#808080; font-weight:bold; }
        .user-pupil { color:#008000; font-weight:bold; }
        .user-specialist { color:#03a89e; font-weight:bold; }
        .user-expert { color:#0000ff; font-weight:bold; }
        .user-candidate-master { color:#aa00aa; font-weight:bold; }
        .user-master { color:#ff8c00; font-weight:bold; }
        .user-grandmaster,.user-legendary { color:#ff0000; font-weight:bold; }
        .rating-val { font-family:Consolas,monospace; font-size:1.1em; }
        .delta-pos { color:#008000; font-size:.85em; }
        .delta-neg { color:#888; font-size:.85em; }
        .delta-zero { color:#ccc; font-size:.85em; }
        .rank-badge { background:#6c757d; color:#fff; padding:2px 6px; border-radius:10px; font-size:.75em; display:inline-block; }
        .team-tag { background:#17a2b8; color:#fff; padding:1px 4px; border-radius:4px; font-size:.8em; margin-left:3px; font-weight:normal; }
        .inactive-row { opacity:.48; }
        .inactive-row td { background:#fcfcfc; }
        .achievement-badge { display:inline-flex; align-items:center; justify-content:center; margin-left:5px; vertical-align:1px; font-size:15px; line-height:1; }
        .achievement-badge.silver-crown { filter:grayscale(1); opacity:.72; }
        .medal-rules { color:#667085; font-size:13px; line-height:1.7; margin-top:8px; }
        .medal-count { font-variant-numeric:tabular-nums; font-weight:700; }
        .medal-name { text-align:left; }
        .legend-inline { display:inline-flex; gap:12px; flex-wrap:wrap; align-items:center; }
        @media (max-width:720px) { body{padding:10px}.card{padding:14px}.header-row{align-items:flex-start}.chart-container{height:300px} }
    </style>
</head>
<body>
<div class="container">
    <div class="top-nav">
        <button id="nav-rating" class="nav-btn" onclick="app.showPage('rating')">Rating 榜</button>
        <button id="nav-medals" class="nav-btn" onclick="app.showPage('medals')">奖牌榜</button>
    </div>

    <section id="page-rating" class="page-section">
        <div class="card">
            <div class="header-row">
                <h1>Rating 统计看板</h1>
                <div style="display:flex;gap:15px;align-items:center;flex-wrap:wrap;">
                    <label style="cursor:pointer;font-size:14px;color:#555;display:flex;align-items:center;gap:5px;margin-right:10px;">
                        <input type="checkbox" id="toggleInactive" onchange="app.renderTable(); app.renderChart();">
                        显示休眠选手
                    </label>
                    <button class="btn btn-export" onclick="exportToExcel()">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                        导出 Excel
                    </button>
                </div>
            </div>
            <div class="chart-container"><canvas id="ratingChart"></canvas></div>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
            <div class="table-wrapper" id="table-container"><p style="text-align:center;padding:20px">正在加载...</p></div>
        </div>
    </section>

    <section id="page-medals" class="page-section">
        <div class="card">
            <div class="header-row" style="margin-bottom:8px"><h1>奖牌榜</h1></div>
            <div class="medal-rules">
                单场奖励互斥，按最高档记录：参赛人数 ≥ 20 的冠军记金冠，否则冠军记银冠；非冠军前 10% 记金牌、前 30% 记银牌、前 60% 记铜牌（均向上取整）。<br>
                排序关键字依次为：金冠、银冠、金牌、银牌、铜牌，均按数量降序；完全相同再按当前 Rating、ID 排序。
            </div>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
            <div class="table-wrapper" id="medal-table-container"></div>
        </div>
    </section>
</div>

class RatingCalculator {
    static getEloWinProbability(ra, rb) { return 1.0 / (1 + Math.pow(10, (rb - ra) / 400.0)); }
    static getSeed(entities, rating) {
        let result = 1;
        for (const other of entities) result += this.getEloWinProbability(other.rating, rating);
        return result;
    }
    static getRatingToRank(entities, rank) {
        let left = 1, right = 8000;
        while (right - left > 1) {
            const mid = Math.floor((left + right) / 2);
            if (this.getSeed(entities, mid) < rank) right = mid; else left = mid;
        }
        return left;
    }
    static calculateDeltas(participants) {
        if (participants.length === 0) return;
        const teamMap = new Map();
        for (const p of participants) {
            if (!teamMap.has(p.teamId)) teamMap.set(p.teamId, []);
            teamMap.get(p.teamId).push(p);
        }
        const teams = Array.from(teamMap.values()).map(members => {
            let sumExp = 0;
            for (const m of members) sumExp += Math.pow(10, m.rating / 800.0);
            return { members, rating: 800 * Math.log10(sumExp), rank: members[0].rank, seed:0, needRating:0, delta:0 };
        });
        for (const a of teams) {
            a.seed = 1;
            for (const b of teams) if (a !== b) a.seed += this.getEloWinProbability(b.rating, a.rating);
        }
        for (const t of teams) {
            const midRank = Math.sqrt(t.rank * t.seed);
            t.needRating = this.getRatingToRank(teams, midRank);
            t.delta = Math.floor((t.needRating - t.rating) / 2);
        }
        teams.sort((a,b) => b.rating - a.rating);
        let sum = 0;
        for (const t of teams) sum += t.delta;
        const inc = Math.floor(-sum / teams.length);
        for (const t of teams) t.delta += inc;
        const CENTER = 1500, K = 45000;
        for (const t of teams) {
            const dist = CENTER - t.rating;
            t.delta += Math.round((dist * Math.abs(dist)) / K);
            const allMemberNames = t.members.map(x => x.originalUser.name);
            for (const m of t.members) {
                m.delta = t.delta;
                m.teamRating = Math.round(t.rating);
                m.seed = t.seed;
                m.teammates = allMemberNames.filter(name => name !== m.originalUser.name);
            }
        }
    }
}

class App {
    constructor() {
        this.users = [];
        this.contestNames = [];
        this.contestParticipantCounts = [];
        this.initData();
        this.renderTable();
        this.renderMedalTable();
        this.renderChart();
        window.addEventListener('hashchange', () => this.syncPageFromHash());
        this.syncPageFromHash();
    }
    getRawData() { return DEFAULT_CSV; }
    initData() { this.users=[]; this.contestNames=[]; this.processData(this.getRawData()); }

    processData(csvString) {
        const normalized = csvString.replace(/\t/g, ',').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        const rows = normalized.trim().split('\n').filter(r => r.trim());
        if (rows.length < 1) return;
        this.contestNames = rows[0].split(',').slice(1).map(s => s.trim());
        for (let i=1;i<rows.length;i++) {
            const cols = rows[i].split(',').map(s => s.trim());
            if (cols.length < 2) continue;
            this.users.push({
                name: cols[0], currentRating: CONFIG.INITIAL_RATING,
                ranks: cols.slice(1).map(val => {
                    val = val.trim();
                    if (val === '-1') return { rank:-1, teamId:null };
                    if (val === '0' || val === '') return { rank:0, teamId:null };
                    const match = val.match(/^(\d+)(.*)$/);
                    if (!match) return { rank:0, teamId:null };
                    const r = parseInt(match[1]);
                    let tId = match[2].trim();
                    if (tId.startsWith(':') || tId.startsWith('-') || tId.startsWith('_')) tId = tId.substring(1).trim();
                    return { rank:r, teamId:tId || null };
                }),
                history: [], isActive:true, currentAbsence:0, participatedCount:0,
                awards: { goldCrown:0, silverCrown:0, goldMedal:0, silverMedal:0, bronzeMedal:0 }
            });
        }
        this.contestParticipantCounts = this.contestNames.map((_, cIdx) => this.users.reduce((cnt,u) => cnt + ((u.ranks[cIdx]?.rank || 0) > 0 ? 1 : 0), 0));

        this.contestNames.forEach((_, cIdx) => {
            const parts = [], absentees = [];
            this.users.forEach(u => {
                const rObj = u.ranks[cIdx] || { rank:0, teamId:null };
                if (rObj.rank > 0) {
                    const tId = rObj.teamId || u.name;
                    parts.push({ originalUser:u, rating:u.currentRating, rank:rObj.rank, teamId:tId, delta:0 });
                } else if (rObj.rank === -1) absentees.push(u);
                else u.history.push({ rating:u.currentRating, delta:0, rank:0, teamId:null });
            });
            RatingCalculator.calculateDeltas(parts);
            parts.forEach(p => {
                const user = p.originalUser;
                let newcomerMultiplier = 1.0;
                if (user.participatedCount === 0) newcomerMultiplier = 2.0;
                else if (user.participatedCount === 1) newcomerMultiplier = 1.5;
                else if (user.participatedCount === 2) newcomerMultiplier = 1.3;
                else if (user.participatedCount === 3) newcomerMultiplier = 1.2;
                else if (user.participatedCount === 4) newcomerMultiplier = 1.1;
                let dormancyMultiplier = 1.0;
                if (user.currentAbsence > 2) dormancyMultiplier = user.currentAbsence >= 20 ? 2.0 : 1.0 + Math.pow(user.currentAbsence - 2, 2) / 324.0;
                const multiplier = Math.max(newcomerMultiplier, dormancyMultiplier);
                let mulType = '无';
                if (multiplier > 1.0) mulType = newcomerMultiplier >= dormancyMultiplier ? '新手定级' : '休眠复出';
                const finalDelta = Math.round(p.delta * multiplier);
                user.currentRating += finalDelta;
                const displayTeam = p.teamId === user.name ? null : p.teamId;
                user.history.push({ rating:user.currentRating, delta:finalDelta, rank:p.rank, teamId:displayTeam, teamRating:p.teamRating, seed:p.seed, teammates:p.teammates, multiplierUsed:multiplier, mulType });
                user.currentAbsence = 0;
                user.participatedCount += 1;
            });
            absentees.forEach(u => {
                u.currentRating += CONFIG.ABSENT_PENALTY;
                u.currentAbsence += 1;
                u.history.push({ rating:u.currentRating, delta:CONFIG.ABSENT_PENALTY, rank:-1, teamId:null });
            });
        });

        this.users.forEach(u => {
            let consecutiveAbsence = 0;
            for (let i=u.ranks.length-1;i>=0;i--) {
                if (u.ranks[i].rank <= 0) consecutiveAbsence++; else break;
            }
            const hasParticipated = u.ranks.some(r => r.rank > 0);
            u.isActive = hasParticipated && consecutiveAbsence < 2;
        });
        this.calculateAwards();
    }

    calculateAwards() {
        this.users.forEach(u => u.awards = { goldCrown:0, silverCrown:0, goldMedal:0, silverMedal:0, bronzeMedal:0 });
        this.contestNames.forEach((_, cIdx) => {
            const n = this.contestParticipantCounts[cIdx];
            if (n <= 0) return;
            const goldLine = Math.ceil(n * CONFIG.GOLD_MEDAL_RATIO);
            const silverLine = Math.ceil(n * CONFIG.SILVER_MEDAL_RATIO);
            const bronzeLine = Math.ceil(n * CONFIG.BRONZE_MEDAL_RATIO);
            this.users.forEach(u => {
                const rank = u.ranks[cIdx]?.rank || 0;
                if (rank <= 0) return;
                if (rank === 1) {
                    if (n >= CONFIG.GOLD_CROWN_MIN_PARTICIPANTS) u.awards.goldCrown++;
                    else u.awards.silverCrown++;
                } else if (rank <= goldLine) u.awards.goldMedal++;
                else if (rank <= silverLine) u.awards.silverMedal++;
                else if (rank <= bronzeLine) u.awards.bronzeMedal++;
            });
        });
    }

    getColorClass(r) {
        if (r < 1200) return 'user-newbie'; if (r < 1400) return 'user-pupil'; if (r < 1600) return 'user-specialist';
        if (r < 1900) return 'user-expert'; if (r < 2100) return 'user-candidate-master'; if (r < 2400) return 'user-master';
        if (r < 3000) return 'user-grandmaster'; return 'user-legendary';
    }
    getVisibleUsers() {
        const showInactive = document.getElementById('toggleInactive').checked;
        return (showInactive ? [...this.users] : this.users.filter(u => u.isActive)).sort((a,b) => b.currentRating - a.currentRating || a.name.localeCompare(b.name));
    }
    getNameAchievement(u) {
        if (u.awards.goldCrown > 0) return '<span class="achievement-badge" title="至少获得过一次金冠">👑</span>';
        if (u.awards.silverCrown > 0) return '<span class="achievement-badge silver-crown" title="至少获得过一次银冠">👑</span>';
        if (u.awards.goldMedal > 0) return '<span class="achievement-badge" title="至少获得过一次金牌">🥇</span>';
        return '';
    }
    renderTable() {
        const visibleUsers = this.getVisibleUsers();
        let html = `<table id="rating-table-data"><thead><tr><th>排名</th><th>姓名</th><th>当前分</th>${this.contestNames.map(n => `<th>${n}</th>`).join('')}</tr></thead><tbody>`;
        visibleUsers.forEach((u, idx) => {
            const rowClass = u.isActive ? '' : 'inactive-row';
            const nameSuffix = u.isActive ? '' : ' <span style="font-size:12px;color:#999;">(休眠)</span>';
            html += `<tr class="${rowClass}"><td>${idx + 1}</td><td style="text-align:left"><span class="${this.getColorClass(u.currentRating)}">${u.name}</span>${this.getNameAchievement(u)}${nameSuffix}</td><td style="font-weight:bold;background:${u.isActive ? '#f8f9fa' : '#fcfcfc'};">${u.currentRating}</td>`;
            u.history.forEach(h => {
                if (h.rank === -1) {
                    const penaltyText = h.delta !== 0 ? ` <small>(${h.delta})</small>` : '';
                    html += `<td><span style="color:#d9534f;font-size:.9em;">缺席${penaltyText}</span></td>`;
                } else if (h.rank === 0) html += '<td><span class="delta-zero">-</span></td>';
                else {
                    const dClass = h.delta >= 0 ? 'delta-pos' : 'delta-neg';
                    const sign = h.delta >= 0 ? '+' : '';
                    const teamTagHtml = h.teamId ? `<span class="team-tag">${h.teamId}</span>` : '';
                    let tooltip = `预计排名: ${h.seed ? h.seed.toFixed(2) : '-'}`;
                    if (h.teamId) { tooltip += `\n等效 Rating: ${h.teamRating}`; tooltip += `\n队友: ${h.teammates && h.teammates.length ? h.teammates.join(', ') : '无'}`; }
                    if (h.multiplierUsed && h.multiplierUsed > 1.0) tooltip += `\n${h.mulType}倍率: ${h.multiplierUsed.toFixed(2)}x`;
                    html += `<td title="${tooltip}" style="cursor:help;"><span class="rank-badge">#${h.rank}</span>${teamTagHtml}<br><span class="${this.getColorClass(h.rating)} rating-val">${h.rating}</span><br><span class="${dClass}">(${sign}${h.delta})</span></td>`;
                }
            });
            html += '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('table-container').innerHTML = html;
    }
    renderMedalTable() {
        const keys = ['goldCrown','silverCrown','goldMedal','silverMedal','bronzeMedal'];
        const sorted = [...this.users].sort((a,b) => {
            for (const key of keys) if (a.awards[key] !== b.awards[key]) return b.awards[key] - a.awards[key];
            return b.currentRating - a.currentRating || a.name.localeCompare(b.name);
        });
        let html = '<table><thead><tr><th>排名</th><th>ID</th><th>👑 金冠</th><th>👑 银冠</th><th>🥇 金牌</th><th>🥈 银牌</th><th>🥉 铜牌</th></tr></thead><tbody>';
        sorted.forEach((u,idx) => {
            html += `<tr><td>${idx+1}</td><td class="medal-name"><span class="${this.getColorClass(u.currentRating)}">${u.name}</span></td><td class="medal-count">${u.awards.goldCrown}</td><td class="medal-count">${u.awards.silverCrown}</td><td class="medal-count">${u.awards.goldMedal}</td><td class="medal-count">${u.awards.silverMedal}</td><td class="medal-count">${u.awards.bronzeMedal}</td></tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('medal-table-container').innerHTML = html;
    }
    getDistinctColor(index, alpha=1.0) { const hue = (index * 137.508) % 360; return `hsla(${hue},70%,45%,${alpha})`; }
    renderChart() {
        const visibleUsers = this.getVisibleUsers();
        const ctx = document.getElementById('ratingChart').getContext('2d');
        const datasets = visibleUsers.map((u,i) => {
            const isTop3 = i < 3;
            const color = this.getDistinctColor(i, u.isActive ? 1.0 : 0.4);
            return { label:u.name + (u.isActive ? '' : ' (休眠)'), data:[CONFIG.INITIAL_RATING,...u.history.map(h=>h.rating)], borderColor:color, backgroundColor:color, borderWidth:isTop3?2.5:(u.isActive?2:1), borderDash:u.isActive?[]:[5,5], hidden:!isTop3, tension:.3, pointRadius:u.isActive?3:1, pointHoverRadius:6, hoverBorderWidth:4, hoverBorderColor:color, order:i };
        });
        if (window.myChartInstance) window.myChartInstance.destroy();
        window.myChartInstance = new Chart(ctx,{ type:'line', data:{ labels:['初始',...this.contestNames], datasets }, options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false}, plugins:{ legend:{position:'bottom',labels:{usePointStyle:true,padding:15,boxWidth:8,font:{size:11}}}, tooltip:{mode:'index',intersect:false,itemSort:(a,b)=>b.raw-a.raw} }, scales:{ y:{grid:{color:'#f0f0f0'}}, x:{grid:{display:false}} } } });
    }
    showPage(page, updateHash=true) {
        const target = page === 'medals' ? 'medals' : 'rating';
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`page-${target}`).classList.add('active');
        document.getElementById(`nav-${target}`).classList.add('active');
        if (updateHash && location.hash !== `#${target}`) history.replaceState(null,'',`#${target}`);
    }
    syncPageFromHash() { this.showPage(location.hash === '#medals' ? 'medals' : 'rating', false); }
}

const app = new App();
function exportToExcel() {
    const table = document.getElementById('rating-table-data');
    if (!table) return;
    const style = `<style>table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:5px;text-align:center;vertical-align:middle}th{background:#eee;font-weight:bold}.user-newbie{color:#808080;font-weight:bold}.user-pupil{color:#008000;font-weight:bold}.user-specialist{color:#03a89e;font-weight:bold}.user-expert{color:#0000ff;font-weight:bold}.user-candidate-master{color:#aa00aa;font-weight:bold}.user-master{color:#ff8c00;font-weight:bold}.user-grandmaster,.user-legendary{color:#ff0000;font-weight:bold}.delta-pos{color:#008000}.delta-neg{color:#888}.delta-zero{color:#ccc}.rank-badge{background:#666;color:#fff;border-radius:3px;padding:1px 3px;font-size:10px}.team-tag{color:#007bff;font-size:10px}.inactive-row{color:#999}</style>`;
    const fullHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8">${style}</head><body>${table.outerHTML}</body></html>`;
    const blob = new Blob([fullHtml], {type:'application/vnd.ms-excel'});
    const downloadLink = document.createElement('a');
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = `Rating排名_${new Date().toISOString().slice(0,10)}.xls`;
    document.body.appendChild(downloadLink); downloadLink.click(); document.body.removeChild(downloadLink);
}
